services:
  - type: web
    name: docai-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_MODEL
        value: gemini-2.0-flash
    # Users supply their own Gemini API key through the UI — no server key needed
